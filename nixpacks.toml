# Railway build configuration — single-service deployment.
# Builds the React frontend with REACT_APP_BACKEND_URL forced to empty so
# the JS uses relative `/api/*` URLs (same origin as the FastAPI host).

[phases.setup]
nixPkgs = ["python311", "nodejs_20", "gcc"]

[phases.install]
cmds = [
  "cd frontend && npm install --legacy-peer-deps",
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r backend/requirements.txt",
]

[phases.build]
cmds = [
  "cd frontend && CI=false REACT_APP_BACKEND_URL= npm run build",
]

[start]
cmd = "cd backend && /opt/venv/bin/uvicorn server:app --host 0.0.0.0 --port $PORT"
