# Railway build configuration — single-service deployment.
# Builds the React frontend, installs Python deps, and runs FastAPI which
# serves both /api/* and the React app from one process.

[phases.setup]
nixPkgs = ["python311", "nodejs_20", "gcc"]

[phases.install]
cmds = [
  "cd frontend && npm install --legacy-peer-deps",
  "python3 -m ensurepip --upgrade || true",
  "python3 -m pip install --upgrade pip --break-system-packages",
  "python3 -m pip install -r backend/requirements.txt --break-system-packages",
]

[phases.build]
cmds = [
  "cd frontend && CI=false npm run build",
]

[start]
cmd = "cd backend && python3 -m uvicorn server:app --host 0.0.0.0 --port $PORT"
