        - lang: 'PHP'
          source: |
            <?php
            $client = new GuzzleHttp\Client();
            $response = $client->request('GET', 'https://secure.rentecdirect.com/api/v3/properties', [
                'query' => [
                    'include_subunits' => 'true'
                ],
                'headers' => [
                    'X-API-Key' => 'YOUR_API_KEY',
                    'Accept' => 'application/json',
                ],
            ]);
            echo $response->getBody();
        - lang: 'JavaScript'
          label: 'Node'
          source: |
            const axios = require('axios');
            axios.get('https://secure.rentecdirect.com/api/v3/properties', {
                params: {
                    include_subunits: true
                },
                headers: {
                    'X-API-Key': 'YOUR_API_KEY',
                    'Accept': 'application/json'
                }
            })
            .then(response => console.log(response.data))
            .catch(error => console.error(error));
        - lang: 'Python'
          label: 'Python'
          source: |
            import requests
            params = {'include_subunits': 'true'}
            headers = {
                'X-API-Key': 'YOUR_API_KEY',
                'Accept': 'application/json'
            }
            response = requests.get('https://secure.rentecdirect.com/api/v3/properties', params=params, headers=headers)
            print(response.json())
      parameters:
        - in: query
          name: include_subunits
          schema:
            type: boolean
          description: Set to true to include nested subunits.
        - in: query
          name: sub_of
          schema:
            type: integer
          description: Filter by parent property ID.
        - in: query
          name: archived
          schema:
            type: boolean
          description: Include inactive properties.
        - in: query
          name: occupied
          schema:
            type: boolean
          description: |
            Filter by occupancy status.
            - `true`: Only show properties with current renters.
            - `false`: Only show vacant properties.
            - Not specified: Show all properties.
        - in: query
          name: marketing
          schema:
            type: boolean
          description: Set to true to include marketing information in a `marketing` object.
        - in: query
          name: age
          schema:
            type: string
          description: |
