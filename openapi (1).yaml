openapi: 3.0.0
info:
  title: Rentec Direct API v3
  x-logo:
    url: /owners/images/rentec_logo_220w.png
    altText: Rentec Direct Logo
  description: |
    Welcome to the Rentec Direct API v3. This API provides access to your Rentec Direct data in JSON format.
    
    The Rentec Open API is a [Rentec Labs](https://help.rentecdirect.com/article/699-what-is-rentec-labs) feature.
    
    ### Authentication
    API keys can be generated in the Rentec Direct interface at Settings -> Utilities -> API Keys. 
    You can create multiple keys with granular permissions (e.g., "read:properties", "write:work_orders"). 
    Each key is restricted to the specific actions and methods assigned to it.
    Read permissions allow `GET` requests, while Write permissions allow `POST` requests for the specified resource.

    ### Rate Limiting
    The API is rate limited to **60 requests per minute** per user. If you exceed this limit, the API will return a `429 Too Many Requests` status code.
    
    ### Changelog
    For a detailed history of changes, see the [Changelog](changelog.html).
  version: 3.0.1
servers:
  - url: /api/v3
    description: Relative server URL
  - url: https://secure.rentecdirect.com/api/v3
    description: Production server

tags:
  - name: Authentication
    description: Verify API connection and authentication
  - name: Properties
    description: Manage and list properties
  - name: Tenants
    description: Access tenant information
  - name: Leads
    description: Access lead information (prospects)
  - name: Owners
    description: Access owner information
  - name: Vendors
    description: Access vendor information
  - name: Leases
    description: Access rental agreement details
  - name: Transactions
    description: Access financial records
  - name: Accounts
    description: Manage account categories
  - name: Products
    description: Manage product categories
  - name: Banks
    description: Access bank account information
  - name: Work Orders
    description: Manage maintenance Work Orders
  - name: Files
    description: Upload and manage files
  - name: Messaging
    description: Manage communication records and messages
  - name: Lookup
    description: Search for contacts across multiple types
  - name: Accounting
    description: Financial and accounting resources

x-tagGroups:
  - name: Authentication
    tags:
      - Authentication
  - name: Properties
    tags:
      - Properties
  - name: Contacts
    tags:
      - Tenants
      - Leads
      - Owners
      - Vendors
      - Lookup
  - name: Leases
    tags:
      - Leases
  - name: Work Orders
    tags:
      - Work Orders
  - name: Messaging
    tags:
      - Messaging
  - name: Files
    tags:
      - Files
  - name: Accounting
    tags:
      - Transactions
      - Accounts
      - Products
      - Banks

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    data_only:
      in: query
      name: data_only
      schema:
        type: boolean
      description: Set to true to return raw data without summary envelope.

  schemas:
    Summary:
      type: object
      properties:
        records:
          type: integer
          description: Total number of records returned in this response.
        timestamp:
          type: string
          format: date-time
          description: Server timestamp when the response was generated.

    TransactionSummary:
      allOf:
        - $ref: '#/components/schemas/Summary'
        - type: object
          properties:
            starting_balance:
              type: number
              format: float
              description: The balance at the beginning of the current response set (page).
            ending_balance:
              type: number
              format: float
              description: The balance at the end of the current response set (page).
            page:
              type: integer
              description: The current page number (1-based).
              minimum: 1
            page_size:
              type: integer
              description: The number of records per page.
            more_records:
              type: boolean
              description: Indicates if there are more records available beyond the current set.
            next_page_url:
              type: string
              format: uri
              nullable: true
              description: The URL to the next page of results, including all current parameters.

    Property:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'property:ID'.
        property_id:
          type: integer
        owner_id:
          type: integer
        sub_of:
          type: integer
          nullable: true
        nickname:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        monthly_rent:
          type: number
        security_dep:
          type: number
        archived:
          type: boolean
        notes:
          type: string
        ptype:
          type: string
        date_created:
          type: string
          format: date-time
        date_updated:
          type: string
          format: date-time
        multiplex:
          type: boolean
        multiunits:
          type: integer
        default_bank:
          type: integer
          description: 'The id of the default income bank account, otherwise 0.'
        default_bank_expense:
          type: integer
          description: 'The id of the default expense bank account, otherwise 0.'
        renters:
          type: array
          items:
            $ref: '#/components/schemas/PropertyRenter'
        subunits:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        marketing:
          $ref: '#/components/schemas/PropertyMarketing'
          nullable: true

    PropertyMarketing:
      type: object
      properties:
        bedrooms:
          type: number
        bathrooms:
          type: number
        sqft:
          type: integer
        appliances:
          type: string
        description:
          type: string
        contact:
          type: string
        ad_enable:
          type: boolean
        app_enable:
          type: boolean
        yearbuilt:
          type: string
        leaseterms:
          type: string
        synd_enable:
          type: boolean
        rental_assistance:
          type: boolean
        lease:
          type: boolean
        allow_animals:
          type: boolean
        allow_smokers:
          type: boolean
        wheelchair_access:
          type: boolean
        washer_dryer:
          type: boolean
        garage_carport:
          type: boolean
        air_conditioner:
          type: boolean
        longitude:
          type: number
        latitude:
          type: number
        fiftyfive_plus:
          type: boolean
        washer_dryer_hookups:
          type: boolean
        files:
          type: array
          items:
            $ref: '#/components/schemas/PropertyMarketingFile'
          description: List of marketing files (images) for the property.

    PropertyMarketingFile:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'file:ID'.
        file_id:
          type: integer
        filename:
          type: string
        bytes:
          type: integer
        upload_date:
          type: string
          format: date-time

    PropertyRenter:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'tenant:ID'.
        renter_id:
          type: integer
        renter_name:
          type: string
        move_in:
          type: string
          format: date-time
        move_out:
          type: string
          format: date-time
        subtenant:
          type: boolean
          description: Whether the tenant is a sub-tenant.

    Tenant:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'tenant:ID'.
        renter_id:
          type: integer
        f_name:
          type: string
        l_name:
          type: string
        company:
          type: string
        email:
          type: string
        phone:
          type: string
        mphone:
          type: string
        notes:
          type: string
        portal_enable:
          type: boolean
        archived:
          type: boolean
        subtenant:
          type: boolean
          description: Whether the tenant is a sub-tenant.
        subtenant_of:
          type: integer
          nullable: true
          description: The ID of the primary tenant this tenant is a sub-tenant of. This field is omitted if the tenant is not a sub-tenant. If this is set, properties of the primary tenant are also included in the properties array.
        subtenants:
          type: array
          description: A list of renter_ids for sub-tenants linked to this primary tenant.
          items:
            type: integer
        balance:
          type: number
        date_created:
          type: string
          format: date-time
          nullable: true
        date_updated:
          type: string
          format: date-time
          nullable: true
        properties:
          type: array
          items:
            $ref: '#/components/schemas/TenantProperty'

    TenantProperty:
      type: object
      properties:
        property_id:
          type: integer
        nickname:
          type: string
        move_in:
          type: string
          format: date-time
        move_out:
          type: string
          format: date-time

    Lead:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'lead:ID'.
        prospect_id:
          type: integer
          description: Alias of lead_id.
        lead_id:
          type: integer
          description: Alias of prospect_id for naming convention.
        f_name:
          type: string
        l_name:
          type: string
        email:
          type: string
        phone:
          type: string
        mphone:
          type: string
          description: mobile phone
        monthly_income:
          type: number
        move_in:
          type: string
          format: date-time
          nullable: true
          description: move in availability date
        monthly_rent_min:
          type: number
          nullable: true
          description: minimum monthly rent desired
        monthly_rent_max:
          type: number
          nullable: true
          description: maximum monthly rent desired
        occupants:
          type: integer
          description: number of occupants in the household
        allow_animals:
          type: boolean
        allow_smokers:
          type: boolean
        fiftyfive_plus:
          type: boolean
        washer_dryer_hookups:
          type: boolean
        wheelchair_access:
          type: boolean
        rental_assistance:
          type: boolean
        no_lease:
          type: boolean
        washer_dryer:
          type: boolean
        bedrooms_min:
          type: integer
        bathrooms_min:
          type: integer
        garage_carport:
          type: boolean
        air_conditioner:
          type: boolean
        search_city:
          type: string
        search_state:
          type: string
        longitude:
          type: number
        latitude:
          type: number
        search_range:
          type: number
          description: miles away from their search location to consider
        notes:
          type: string
        date_created:
          type: string
          format: date-time
          nullable: true
        date_updated:
          type: string
          format: date-time
          nullable: true
        date_contacted:
          type: string
          format: date-time
          nullable: true
        archived:
          type: boolean

    Lease:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'lease:ID'.
        lease_id:
          type: integer
        property_id:
          type: integer
        renter_id:
          type: integer
        move_in:
          type: string
          format: date-time
        move_out:
          type: string
          format: date-time
        lease_begin:
          type: string
          format: date-time
        lease_end:
          type: string
          format: date-time
        balance:
          type: number
        deposit_balance:
          type: number

    Transaction:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'transaction:ID'.
        transaction_id:
          type: integer
        transaction_time:
          type: string
          format: date-time
          description: "Transaction time in ISO 8601 format (e.g., 2026-04-15T10:55:00-07:00). Matches the summary timestamp format."
        property_id:
          type: integer
          nullable: true
          description: Property ID. This field is hidden if invoice_id is present.
        renter_id:
          type: integer
          nullable: true
        category_id:
          type: integer
          description: Category ID. This field is hidden if invoice_id is present.
        category_name:
          type: string
          description: Category name. This field is hidden if invoice_id is present.
        description:
          type: string
        notes:
          type: string
        amount:
          type: number
        check_num:
          type: string
          description: Check number. This field is hidden if invoice_id is present.
        pmt_type:
          type: string
          description: Payment type. This field is hidden if invoice_id is present.
        memo:
          type: string
        split_id:
          type: integer
          nullable: true
          description: Split ID. This field is hidden if invoice_id is present.
        invoice_id:
          type: integer
          nullable: true
        invoice_description:
          type: string
          nullable: true
        tcount:
          type: integer
          nullable: true
          description: Number of transactions grouped in this record (e.g., for an invoice or split).
        vendor_id:
          type: integer
          nullable: true
          description: Vendor ID. This field is hidden if invoice_id is present.
        owner_id:
          type: integer
          nullable: true
          description: Owner ID. This field is hidden if invoice_id is present.
        bank_id:
          type: integer
          nullable: true
          description: Bank account ID.
        files:
          type: array
          description: Attached files for this transaction. Included only if files are present.
          items:
            type: object
            properties:
              file_id:
                type: integer
              filename:
                type: string
              upload_date:
                type: string
                format: date-time
              bytes:
                type: integer

    Vendor:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'vendor:ID'.
        vendor_id:
          type: integer
        name:
          type: string
        industry:
          type: string
        contact:
          type: string
        email:
          type: string
        address:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        phone:
          type: string
        mphone:
          type: string
        rate:
          type: string
        notes:
          type: string
        collected:
          type: boolean
        date_created:
          type: string
          format: date-time
          nullable: true
        date_updated:
          type: string
          format: date-time
          nullable: true

    Owner:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'owner:ID'.
        owner_id:
          type: integer
        f_name:
          type: string
        m_name:
          type: string
        l_name:
          type: string
        company:
          type: string
        contact:
          type: string
        address:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        phone:
          type: string
        mphone:
          type: string
        notes:
          type: string
        email:
          type: string
        portal_enable:
          type: boolean
        acct_number:
          type: string
        archived:
          type: boolean
        date_created:
          type: string
          format: date-time
          nullable: true
        date_updated:
          type: string
          format: date-time
          nullable: true

    Account:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'account:ID'.
        account_id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [I, E, O, C, A, L, Q, P]
          description: |
            Account type:
            - I: Income
            - E: Expense
            - O: Other
            - A: Asset
            - L: Liability
            - Q: Equity
        class:
          type: string
        default:
          type: boolean
        archived:
          type: boolean
        surcharges:
          type: array
          items:
            $ref: '#/components/schemas/Surcharge'

    Product:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'product:ID'.
        name:
          type: string
        account_id:
          type: integer
        class:
          type: string
        default:
          type: boolean
        archived:
          type: boolean
        surcharges:
          type: array
          items:
            $ref: '#/components/schemas/Surcharge'

    Bank:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'bank:ID'.
        bank_id:
          type: integer
        account_type:
          type: string
        account_name:
          type: string
        active:
          type: boolean
        archived:
          type: boolean
        bank_name:
          type: string
        bank_address:
          type: string
        bank_city:
          type: string
        bank_state:
          type: string
        bank_zip:
          type: string
        routing_number:
          type: string
          description: Masked routing number.
        payments:
          type: boolean
        payment_types:
          type: array
          items:
            type: string
            enum: [ACH, CC]

    Surcharge:
      type: object
      properties:
        id:
          type: integer
        category_id:
          type: integer
        name:
          type: string
        percentage:
          type: number
        fixed:
          type: number
        active:
          type: boolean
        archived:
          type: boolean

    WorkOrder:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'work_order:ID'.
        workorder_id:
          type: integer
        property_id:
          type: integer
          nullable: true
        renter_id:
          type: integer
          nullable: true
        status:
          type: string
          description: |
            The status of the Work Order.
            - OpenU: Unassigned (alias for Unassigned)
            - OpenA: Assigned (alias for Assigned)
            - Parts: Parts on Order
            - Work: Work in Progress
            - Finalized: Finalized
            - Closed: Closed
            - Unassigned: (alias for OpenU)
            - Assigned: (alias for OpenA)
        assigned:
          type: string
        short_desc:
          type: string
        description:
          type: string
        resolution:
          type: string
        date_received:
          type: string
          format: date
        date_created:
          type: string
          format: date-time
        date_assigned:
          type: string
          format: date
        date_resolved:
          type: string
          format: date
        cost:
          type: number
        vendor_id:
          type: integer
          nullable: true
        wo_number:
          type: integer
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: Priority level (1-5)
        archived:
          type: boolean
        notes:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderNote'

    WorkOrderNote:
      type: object
      properties:
        note_id:
          type: integer
        note:
          type: string
        private:
          type: boolean
        created:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'message:ID'.
        email_id:
          type: integer
        alt_user_id:
          type: integer
          nullable: true
        email_time:
          type: string
          format: date-time
        renter_id:
          type: integer
        prospect_id:
          type: integer
        owner_id:
          type: integer
        vendor_id:
          type: integer
        subject:
          type: string
        body:
          type: string
        status:
          type: string
        direction:
          type: string
          enum: [IN, OUT]

    File:
      type: object
      properties:
        id:
          type: string
          description: Unique global identifier in the format 'file:ID'.
        file_id:
          type: integer
        property_id:
          type: integer
          nullable: true
        renter_id:
          type: integer
          nullable: true
        owner_id:
          type: integer
          nullable: true
        vendor_id:
          type: integer
          nullable: true
        workorder_id:
          type: integer
          nullable: true
        transaction_id:
          type: integer
          nullable: true
        split_id:
          type: integer
          nullable: true
        filename:
          type: string
        bytes:
          type: integer
        upload_date:
          type: string
          format: date-time
        last_updated:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: string
          description: List of detailed error messages, often for validation errors.
        vendor_id:
          type: integer
          description: Vendor ID of the existing vendor if the error is a duplicate vendor name.

security:
  - ApiKeyAuth: []
  - BearerAuth: []

paths:
  /ping:
    get:
      tags:
        - Authentication
      summary: Connection Check
      description: Returns minimal data to indicate authentication is successful and which user is authenticated.
      operationId: ping
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: "#/components/schemas/Summary"
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: success
                      message:
                        type: string
                        example: Authentication successful
                      user:
                        type: object
                        properties:
                          user_id:
                            type: integer
                          company:
                            type: string
                            nullable: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /lookup:
    get:
      tags:
        - Lookup
      summary: Search for contacts (All Types)
      description: |
        Search for contact records across all types (tenants, leads, owners, vendors) using email, phone number, name, or company.
        Returns matches grouped by contact type.

        For type-specific searches, see:
        * `/lookup/tenant`
        * `/lookup/owner`
        * `/lookup/vendor`
        * `/lookup/prospect`
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters: &lookupParameters
        - name: email
          in: query
          description: Email address to search for.
          schema:
            type: string
        - name: phone
          in: query
          description: Phone number to search for (matches against phone or mphone).
          schema:
            type: string
        - name: f_name
          in: query
          description: First name to search for.
          schema:
            type: string
        - name: l_name
          in: query
          description: Last name to search for.
          schema:
            type: string
        - name: company
          in: query
          description: Company name to search for.
          schema:
            type: string
        - name: flatten
          in: query
          description: |
            If set to true, returns all results in a single flat array instead of grouped by type.
            Each record will include a `type` field indicating the entity type (e.g., 'tenant', 'lead', 'owner', 'vendor').
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/data_only'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: '#/components/schemas/Summary'
                  data:
                    oneOf:
                      - type: object
                        description: Grouped results by entity type (default).
                        properties:
                          tenants:
                            type: array
                            items:
                              $ref: '#/components/schemas/Tenant'
                          leads:
                            type: array
                            items:
                              $ref: '#/components/schemas/Lead'
                          owners:
                            type: array
                            items:
                              $ref: '#/components/schemas/Owner'
                          vendors:
                            type: array
                            items:
                              $ref: '#/components/schemas/Vendor'
                      - type: array
                        description: Flat array of results when flatten=true.
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/Tenant'
                            - $ref: '#/components/schemas/Lead'
                            - $ref: '#/components/schemas/Owner'
                            - $ref: '#/components/schemas/Vendor'
        '400':
          description: Bad Request - missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

