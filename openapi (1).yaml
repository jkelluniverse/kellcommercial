              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload
                workorder_id:
                  type: integer
                  description: Optional. The ID of the Work Order to associate the file with.
                renter_id:
                  type: integer
                  description: Optional. The ID of the tenant to associate the file with.
                transaction_id:
                  type: integer
                  description: Optional. The ID of the transaction to associate the file with.
                property_id:
                  type: integer
                  description: Optional. The ID of the property to associate the file with.
                owner_id:
                  type: integer
                  description: Optional. The ID of the owner to associate the file with.
                vendor_id:
                  type: integer
                  description: Optional. The ID of the vendor to associate the file with.
              required:
