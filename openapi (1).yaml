      summary: Create an expense transaction
      description: Creates a new expense transaction. After creation, you can upload or attach invoices or receipts via `/files` by referencing the returned `transaction_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - category_id
                - amount
                - pmt_type
              properties:
                property_id:
                  type: integer
                  description: Property ID. One of `property_id` or `bank_id` is required. Used to resolve the property's default expense bank account fallback if `bank_id` is missing.
                bank_id:
                  type: integer
                  description: Bank account ID. One of `property_id` or `bank_id` is required. If omitted, API falls back to the property's `default_bank_expense` value when `property_id` is provided.
                renter_id:
                  type: integer
                  description: Optional tenant ID association.
                category_id:
                  type: integer
                  description: Expense category ID.
                amount:
                  type: number
                  format: float
                  maximum: 9999999.99
                  description: The expense amount expressed as a positive value. Negative amounts are not allowed. Maximum value is 9999999.99.
                transaction_time:
                  type: string
                  format: date-time
                  description: "Transaction date and time (format: yyyy-mm-dd hh:ii:ss). Defaults to current time if omitted."
                memo:
                  type: string
                check_num:
                  type: string
                pmt_type:
                  type: string
                  enum: [CH, PCH, CA, CR, O, ACH]
                  description: "Payment type: CH (Check), PCH (Print Check), CA (Cash), CR (Credit Card), O (Other), ACH (ACH)."
      responses:
        '201':
          description: Transaction created
          content:
            application/json:
              schema:
