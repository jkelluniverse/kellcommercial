            curl -X POST "https://secure.rentecdirect.com/api/v3/work_orders" \
              -H "X-API-Key: YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "property_id": 123,
                "short_desc": "Leaking Faucet",
                "description": "The kitchen faucet is leaking.",
                "status": "OpenU",
                "priority": 2
              }'
        - lang: 'PHP'
          source: |
            <?php
            $client = new GuzzleHttp\Client();
            $response = $client->request('POST', 'https://secure.rentecdirect.com/api/v3/work_orders', [
                'headers' => [
                    'X-API-Key' => 'YOUR_API_KEY',
                    'Accept' => 'application/json',
                    'Content-Type' => 'application/json',
                ],
                'json' => [
                    'property_id' => 123,
                    'short_desc' => 'Leaking Faucet',
                    'description' => 'The kitchen faucet is leaking.',
                    'status' => 'OpenU',
                    'priority' => 2
                ]
            ]);
            echo $response->getBody();
        - lang: 'JavaScript'
          label: 'Node'
          source: |
            const axios = require('axios');
            axios.post('https://secure.rentecdirect.com/api/v3/work_orders', {
                property_id: 123,
                short_desc: 'Leaking Faucet',
                description: 'The kitchen faucet is leaking.',
                status: 'OpenU',
                priority: 2
            }, {
                headers: {
                    'X-API-Key': 'YOUR_API_KEY',
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            })
            .then(response => console.log(response.data))
            .catch(error => console.error(error));
        - lang: 'Python'
          label: 'Python'
          source: |
            import requests
            data = {
                'property_id': 123,
                'short_desc': 'Leaking Faucet',
                'description': 'The kitchen faucet is leaking.',
                'status': 'OpenU',
                'priority': 2
            }
            headers = {
                'X-API-Key': 'YOUR_API_KEY',
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            }
            response = requests.post('https://secure.rentecdirect.com/api/v3/work_orders', json=data, headers=headers)
            print(response.json())
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - property_id
                - short_desc
              properties:
                property_id:
                  type: integer
                renter_id:
                  type: integer
                contact_renter_id:
                  type: integer
                vendor_id:
                  type: integer
                short_desc:
                  type: string
                  maxLength: 100
                description:
                  type: string
                status:
                  type: string
                  enum: [OpenU, OpenA, Parts, Work, Finalized, Closed, Unassigned, Assigned]
                  description: |
                    The status of the Work Order.
                    - OpenU: Unassigned
                    - OpenA: Assigned
                    - Parts: Parts on Order
                    - Work: Work in Progress
                    - Finalized: Finalized
                    - Closed: Closed
                    - Unassigned: (alias for OpenU)
                    - Assigned: (alias for OpenA)
                priority:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Priority level (1-5)
                date_received:
                  type: string
                  format: date
                date_assigned:
                  type: string
                  format: date
                date_resolved:
                  type: string
                  format: date
                cost:
                  type: number
                tenant_view:
                  type: boolean
                owner_view:
                  type: boolean
                private_notes:
                  type: string
                email_manager:
                  type: boolean
      responses:
        '201':
          description: Work Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: '#/components/schemas/Summary'
                  data:
                    $ref: '#/components/schemas/WorkOrder'
        '200':
          description: OK - Duplicate Work Order already exists
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WorkOrder'
                  - type: object
                    properties:
                      duplicate:
                        type: boolean
        '400':
          description: Invalid input or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Property, Renter, or Vendor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

