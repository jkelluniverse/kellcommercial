  /messages:
    get:
      tags:
        - Messaging
      summary: List messages
      description: Returns a list of messages (emails/communications) for specified entities.
      parameters:
        - in: query
          name: renter_id
          schema:
            type: integer
          description: Tenant (renter) ID.
        - in: query
          name: prospect_id
          schema:
            type: integer
          description: Prospect ID.
        - in: query
          name: owner_id
          schema:
            type: integer
          description: Owner ID.
        - in: query
          name: vendor_id
          schema:
            type: integer
          description: Vendor ID.
        - in: query
          name: unread_only
          schema:
            type: boolean
            default: false
          description: Only return unread messages.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: page_size
          schema:
            type: integer
            default: 50
          description: Number of messages per page.
        - in: query
          name: age
          schema:
            type: string
          description: |
            Filter messages by age using a value+unit string.
            Supported units: d (days), m (minutes), s (seconds).
            Examples: "30d", "15m", "45s". If no unit is provided, days are assumed.
            Only returns messages from the last N units. Sets start_date if not provided.
        - in: query
          name: start_date
          schema:
            type: string
            format: date
          description: Filter messages starting from this date (YYYY-MM-DD).
        - in: query
          name: end_date
          schema:
            type: string
            format: date
          description: Filter messages up to this date (YYYY-MM-DD).
      responses:
        '200':
          description: A list of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: '#/components/schemas/Summary'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
    post:
      tags:
        - Messaging
      summary: Record a message
      description: |
        Inserts a new message (communication record) into the database.
        
        Note: At least one of `renter_id`, `prospect_id`, `owner_id`, or `vendor_id` must be provided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                subject:
                  type: string
                  description: Subject of the message.
                body:
                  type: string
                  description: Content of the message.
                renter_id:
                  type: integer
                prospect_id:
                  type: integer
                owner_id:
                  type: integer
                vendor_id:
                  type: integer
                date:
                  type: string
                  format: date
                  description: Date of the message (YYYY-MM-DD). Defaults to today.
                time:
                  type: string
                  description: Time of the message (HH:MM). Defaults to now.
                direction:
                  type: string
                  enum: [IN, OUT]
                  default: IN
                status:
                  type: string
                  default: recorded
      responses:
        '201':
          description: Message recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    $ref: '#/components/schemas/Summary'
                  data:
                    $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

